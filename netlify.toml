# The Candy Shop: static site, no build step.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Preview card image: let link-preview bots cache it, but refresh within a day if it changes
[[headers]]
  for = "/assets/og-card.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
